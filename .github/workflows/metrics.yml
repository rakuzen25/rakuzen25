name: Metrics

on:
    schedule: [{ cron: "25 9 * * *" }]
    push:
        branches:
            - main
            - dev
    workflow_dispatch:

jobs:
    github-metrics:
        name: Generate GitHub metrics
        runs-on: ubuntu-latest
        steps:
            - uses: lowlighter/metrics@latest
              with:
                  filename: github.svg
                  token: ${{ secrets.METRICS_TOKEN }}
                  config_timezone: America/Chicago
                  output_action: gist
                  committer_gist: ${{ vars.GIST_ID }}
                  config_padding: 0, 8
                  base: header, activity, community, repositories, metadata
                  base_indepth: yes
                  plugin_activity: yes
                  plugin_followup: yes
                  plugin_followup_indepth: yes
                  plugin_followup_sections: repositories, user
                  plugin_habits: yes
                  plugin_habits_facts: yes
                  plugin_habits_charts: no
                  plugin_languages: yes
                  plugin_languages_details: lines, bytes-size, percentage
                  plugin_languages_indepth: yes
                  plugin_languages_limit: 5
                  plugin_lines: yes
                  plugin_notable: yes
                  plugin_notable_from: all
                  plugin_notable_types: commit
                  plugin_people: yes
                  plugin_traffic: yes
                  plugin_wakatime: yes
                  plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}

    achievements-trivia:
        name: Generate achievements and trivia
        runs-on: ubuntu-latest
        steps:
            - uses: lowlighter/metrics@latest
              with:
                  filename: achievements-trivia.svg
                  token: ${{ secrets.METRICS_TOKEN }}
                  config_timezone: America/Chicago
                  output_action: gist
                  committer_gist: ${{ vars.GIST_ID }}
                  config_padding: 0, 8
                  config_order: achievements, music, 16personalities
                  base: ""
                  plugin_achievements: yes
                  plugin_music: yes
                  plugin_music_provider: spotify
                  plugin_music_token: ${{ secrets.SPOTIFY_TOKENS }}
                  plugin_music_limit: 8
                  plugin_16personalities: yes
                  plugin_16personalities_url: ${{ secrets.PERSONALITIES_URL }}
                  plugin_16personalities_sections: personality, profile, traits

    himehina-info:
        name: Generate HIMEHINA Info screenshot
        runs-on: ubuntu-latest
        steps:
            - uses: lowlighter/metrics@latest
              with:
                  filename: himehina-now-hot.svg
                  token: ${{ secrets.METRICS_TOKEN }}
                  config_timezone: America/Chicago
                  output_action: gist
                  committer_gist: ${{ vars.GIST_ID }}
                  config_padding: 0, 8
                  base: ""
                  plugin_screenshot: yes
                  plugin_screenshot_title: HIMEHINA Info
                  plugin_screenshot_url: https://himehina.jp/
                  plugin_screenshot_selector: "#himehina_grid > div:nth-child(1) > div"
                  plugin_screenshot_viewport: |
                      {
                        "width": 1920,
                        "height": 1080
                      }

    himehina-releases:
        name: Generate HIMEHINA New Releases screenshot
        runs-on: ubuntu-latest
        steps:
            - uses: lowlighter/metrics@latest
              with:
                  filename: himehina-updates.svg
                  token: ${{ secrets.METRICS_TOKEN }}
                  config_timezone: America/Chicago
                  output_action: gist
                  committer_gist: ${{ vars.GIST_ID }}
                  config_padding: 0, 8
                  base: ""
                  plugin_screenshot: yes
                  plugin_screenshot_title: HIMEHINA New Releases
                  plugin_screenshot_url: https://himehina.jp/
                  plugin_screenshot_selector: "#himehina_grid > div:nth-child(5) > div"
                  plugin_screenshot_viewport: |
                      {
                        "width": 1920,
                        "height": 1080
                      }

    keepalive:
        name: Keepalive
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Re-enable workflow
              env:
                GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN || github.token }}
              shell: sh
              run: |
                case "${GITHUB_WORKFLOW_REF:?}" in
                  "${GITHUB_REPOSITORY:?}"/.github/workflows/*.y*ml@*) ;;
                  *) false ;;
                esac
                workflow="${GITHUB_WORKFLOW_REF%%@*}"
                workflow="${workflow#${GITHUB_REPOSITORY}/.github/workflows/}"
                gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
